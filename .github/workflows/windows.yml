name: Windows build and audio tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  installed-sdk:
    name: Build with .NET SDK 9.0.317
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated .NET 9.0.317 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          & $installer -Version 9.0.317 -InstallDir "$env:RUNNER_TEMP/dotnet9-installed" -NoPath
          if (!(Test-Path "$env:RUNNER_TEMP/dotnet9-installed/dotnet.exe")) { throw 'SDK installation failed' }
      - name: Verify installed SDK and build solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dotnet = "$env:RUNNER_TEMP/dotnet9-installed/dotnet.exe"
          $version = & $dotnet --version
          if ($version -ne '9.0.317') { throw "Expected .NET SDK 9.0.317, got $version" }
          & $dotnet build Vocrec.sln -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Installed .NET 9 SDK build failed' }

  windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      release_version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SESKAYIT_TEST_AUDIO_DIR: ${{ github.workspace }}/TestResults/audio

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compute publish version
        id: version
        run: |
          [xml]$project = Get-Content App/SesKayit.csproj
          $base = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "Expected three-part application version, got $base" }
          $version = "$base.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Windows publish version: $version"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Visual Studio solution
        run: dotnet build Vocrec.sln -c Release -warnaserror

      - name: Test mixer
        run: >-
          dotnet test Tests/SesKayit.Tests.csproj -c Release
          --logger "trx;LogFileName=mixer.trx"
          --results-directory TestResults/mixer
          --blame-hang-timeout 2m

      - name: Test Windows AAC encoding and decoding
        run: >-
          dotnet test WindowsTests/SesKayit.WindowsTests.csproj -c Release
          --logger "trx;LogFileName=windows-aac.trx"
          --results-directory TestResults/windows
          --blame-hang-timeout 2m

      - name: Publish standalone EXE
        run: >-
          dotnet publish App/SesKayit.csproj -c Release -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -warnaserror -o dist/win-x64

      - name: Verify STT runtime layout
        run: |
          $required = @(
            'SesKayit.exe', 'balbal_native.dll', 'tools/ffmpeg/ffmpeg.exe',
            '_internal/balbal/_native/balbal_ops_v2.dll',
            '_internal/balbal/_native/balbal_ops_v3.dll',
            '_internal/balbal/_native/balbal_ops_v4.dll',
            'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll',
            'configs/balbal-v2-manas/decoder.json', 'licenses/trslocalwin/LICENSE'
          )
          foreach ($file in $required) {
            if (!(Test-Path "dist/win-x64/$file")) { throw "Missing STT runtime file: $file" }
          }

      - name: Prepare download package
        run: |
          $ErrorActionPreference = 'Stop'
          $package = New-Item -ItemType Directory -Force dist/package
          Copy-Item dist/win-x64/* $package -Recurse
          New-Item -ItemType Directory -Force "$package/models/balbal-v2-manas" | Out-Null
          "Mevcut Manas model dosyalarınızı bu klasöre kopyalayın. Model ağırlıkları pakete dahil değildir." | Set-Content "$package/models/balbal-v2-manas/MODEL-DOSYALARINI-BURAYA.txt" -Encoding utf8
          Copy-Item README.md, LICENSE, NAudio-LICENSE.txt $package
          New-Item -ItemType Directory -Force "$package/licenses" | Out-Null
          Copy-Item Licenses/* "$package/licenses" -Recurse -Force
          $hash = (Get-FileHash dist/package/SesKayit.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SesKayit.exe" | Set-Content dist/package/SHA256SUMS.txt -Encoding utf8
          @"
          Version: ${{ steps.version.outputs.version }}
          Commit: $env:GITHUB_SHA
          Runner: windows-2022
          Automated mixer, AAC, settings, profile and dropdown lifecycle tests passed.
          Physical microphone/loopback devices and live STT/LLM services were not tested.
          "@ | Set-Content dist/package/BUILD-INFO.txt -Encoding utf8

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: Vocrec2-Windows-x64
          path: dist/package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports and synthetic audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Windows release
    needs: [installed-sdk, windows]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested Windows package
        uses: actions/download-artifact@v4
        with:
          name: Vocrec2-Windows-x64
          path: package

      - name: Archive release assets
        shell: bash
        run: |
          cd package
          zip -qr ../Vocrec2-Windows-x64.zip .
          cd ..
          unzip -tq Vocrec2-Windows-x64.zip
          sha256sum Vocrec2-Windows-x64.zip > SHA256SUMS.txt

      - name: Publish release for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.release_version }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          printf 'Windows x64 portable package, version %s.\n\nCommit: %s\n\nAll automated Windows tests passed. Extract the ZIP and run SesKayit.exe; a .NET SDK installation is not required. Copy your existing Manas model into models/balbal-v2-manas. Model weights are not bundled.\n' "$RELEASE_VERSION" "$GITHUB_SHA" > release-notes.md
          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vocrec2 $RELEASE_VERSION" --notes-file release-notes.md --draft
          fi
          gh release upload "$release_tag" Vocrec2-Windows-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          make_latest=false
          if [ "$main_head" = "$GITHUB_SHA" ]; then make_latest=true; fi
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$make_latest" --notes-file release-notes.md
